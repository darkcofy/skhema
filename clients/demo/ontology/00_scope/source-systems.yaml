# Source systems relevant to this domain
# What systems hold data, enforce rules, or define entities we need to model?
#
# Schema:
#   - name: System name
#     type: Database / API / ERP / CRM / Spreadsheet / Manual process
#     owner: Team or person responsible
#     description: What it does in 1-2 sentences
#     key_entities: List of main entities/tables this system manages
#     access: How to get at the data (API, DB access, exports, ask someone)
#
# Example:
# - name: Payment Gateway
#   type: API
#   owner: Platform Engineering
#   description: Processes card transactions and manages payment state
#   key_entities: [transaction, payment_method, settlement]
#   access: REST API with docs at internal-wiki/pg-api

- name: Payment Gateway
  type: API
  owner: Platform Engineering
  description: Processes card transactions in real time, manages authorization and capture lifecycle, and routes to card networks
  key_entities: [transaction, payment_method, authorization, capture, card_network_response]
  access: REST API with docs at internal-wiki/pg-api; read-only DB replica for analytics

- name: Merchant Portal
  type: Database
  owner: Partner Engineering
  description: Self-service portal where merchants manage their account, configure webhooks, view payouts, and set up fee schedules
  key_entities: [merchant, merchant_account, webhook_config, payout_schedule, fee_schedule]
  access: PostgreSQL DB with read access via analytics role

- name: Fraud Engine
  type: API
  owner: Risk & Compliance
  description: Real-time risk scoring engine that evaluates transactions and manages fraud case investigations
  key_entities: [risk_score, fraud_case, fraud_rule, blocked_transaction, dispute]
  access: gRPC API; case data also in Elasticsearch cluster

- name: Billing Ledger
  type: Database
  owner: Finance Engineering
  description: Double-entry ledger tracking all financial movements including settlements, fees, refunds, and chargebacks
  key_entities: [ledger_entry, settlement_batch, fee_record, refund_record, chargeback_record]
  access: PostgreSQL DB; read-only replicas available; nightly CSV exports to data warehouse

- name: Legacy ERP
  type: ERP
  owner: IT Operations
  description: SAP-based system being sunset; still holds 3 years of historical merchant and transaction data that must be migrated
  key_entities: [vendor_master, payment_document, gl_posting, customer_account]
  access: BAPI/RFC interfaces; CSV exports on request from IT Ops team
