# Domain events — things that happen in this domain that other parts of the
# business care about.
#
# Schema:
#   - name: Event name (PascalCase, past tense)
#     concept: Which concept this event is about
#     description: What happened
#     triggers: What causes this event
#     consumers: Who/what reacts to this event
#     payload: Key data included in the event
#
# Example:
# - name: TransactionSettled
#   concept: Transaction
#   description: A transaction has been settled and funds transferred
#   triggers: End-of-day settlement batch processing
#   consumers: [Billing Ledger, Merchant Dashboard, Analytics]
#   payload: [transaction_id, amount, currency, merchant_id, settled_at]

- name: TransactionAuthorized
  concept: Transaction
  description: A payment transaction was successfully authorized by the card network
  triggers: Card network returns approval code in response to authorization request
  consumers: [Fraud Engine, Merchant Portal, Analytics, WebhookEvent dispatcher]
  payload: [transaction_id, amount, currency, merchant_id, payment_method_token, authorized_at, auth_code]

- name: TransactionSettled
  concept: Transaction
  description: A captured transaction has been settled and funds transferred from acquirer to NovaPay
  triggers: End-of-day settlement batch processed by acquirer
  consumers: [Billing Ledger, Merchant Portal, Account service, WebhookEvent dispatcher, Analytics]
  payload: [transaction_id, amount, currency, merchant_id, settlement_batch_id, settled_at]

- name: TransactionRefunded
  concept: Transaction
  description: A merchant initiated a full or partial refund for a previously settled transaction
  triggers: Merchant submits refund request via API or Merchant Portal
  consumers: [Billing Ledger, Account service, Fraud Engine, WebhookEvent dispatcher]
  payload: [transaction_id, refund_amount, currency, merchant_id, reason, refunded_at]

- name: ChargebackOpened
  concept: Chargeback
  description: A cardholder's issuing bank has initiated a chargeback dispute against a settled transaction
  triggers: Chargeback notification received from card network via acquirer
  consumers: [Fraud Engine, Billing Ledger, Merchant Portal, WebhookEvent dispatcher]
  payload: [chargeback_id, transaction_id, amount, reason_code, merchant_id, evidence_due_by]

- name: FraudCaseOpened
  concept: FraudCase
  description: The fraud engine flagged suspicious activity and created a new investigation case
  triggers: Real-time risk score exceeds threshold or pattern detection rule fires
  consumers: [Fraud Ops dashboard, Merchant Portal, Analytics]
  payload: [fraud_case_id, risk_score, trigger_type, transaction_ids, merchant_id, opened_at]

- name: PayoutCompleted
  concept: Payout
  description: Accumulated settlement funds were successfully disbursed to the merchant's bank account
  triggers: Scheduled or manual payout processed by banking integration
  consumers: [Merchant Portal, Account service, WebhookEvent dispatcher, Analytics]
  payload: [payout_id, merchant_id, amount, currency, bank_account_last_four, completed_at]

- name: MerchantActivated
  concept: Merchant
  description: A new merchant completed onboarding and is now live on the platform
  triggers: KYC verification and underwriting approval completed
  consumers: [Payment Gateway, Merchant Portal, Billing Ledger, Partner Engineering notifications]
  payload: [merchant_id, legal_name, dba_name, integration_tier, activated_at]
