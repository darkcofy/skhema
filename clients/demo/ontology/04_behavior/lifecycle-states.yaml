# Lifecycle states for key concepts
# What states can each concept be in, and what transitions are valid?
#
# Schema:
#   - concept: Concept name
#     states:
#       - name: State name
#         description: What this state means
#         terminal: true/false (is this a final state?)
#     transitions:
#       - from: State name
#         to: State name
#         trigger: What causes this transition
#         conditions: Any preconditions (optional)
#
# Example:
# - concept: Transaction
#   states:
#     - name: initiated
#       description: Payment request received, not yet processed
#       terminal: false
#     - name: authorized
#       description: Card network approved, funds reserved
#       terminal: false
#     - name: settled
#       description: Funds transferred to merchant
#       terminal: true
#     - name: declined
#       description: Payment rejected by card network or fraud check
#       terminal: true
#   transitions:
#     - from: initiated
#       to: authorized
#       trigger: Card network approval
#     - from: initiated
#       to: declined
#       trigger: Card network rejection or fraud block
#     - from: authorized
#       to: settled
#       trigger: End-of-day settlement batch

- concept: Transaction
  states:
    - name: initiated
      description: Payment request received by gateway, not yet sent to card network
      terminal: false
    - name: authorized
      description: Card network approved the transaction and funds are reserved on the cardholder's account
      terminal: false
    - name: captured
      description: Authorization converted to a charge; transaction included in next settlement batch
      terminal: false
    - name: settled
      description: Funds transferred from acquirer to NovaPay; transaction is financially complete
      terminal: true
    - name: declined
      description: Payment rejected by card network, issuer, or fraud engine
      terminal: true
    - name: voided
      description: Authorization cancelled before capture; no funds were moved
      terminal: true
    - name: refunded
      description: Merchant initiated a full or partial return of funds to the cardholder
      terminal: true
    - name: disputed
      description: Cardholder has filed a dispute through their issuing bank; chargeback process initiated
      terminal: false
    - name: charged_back
      description: Dispute resolved in cardholder's favor; funds reversed
      terminal: true
  transitions:
    - from: initiated
      to: authorized
      trigger: Card network returns approval code
      conditions: Risk score below threshold, card not expired, funds available
    - from: initiated
      to: declined
      trigger: Card network rejection, fraud block, or issuer decline
    - from: authorized
      to: captured
      trigger: Merchant or auto-capture submits capture request
      conditions: Authorization not expired (typically 7 days)
    - from: authorized
      to: voided
      trigger: Merchant cancels before capture, or authorization expires
    - from: captured
      to: settled
      trigger: End-of-day settlement batch processed by acquirer
    - from: settled
      to: refunded
      trigger: Merchant initiates refund via API or portal
      conditions: Within refund window (180 days from settlement)
    - from: settled
      to: disputed
      trigger: Cardholder files dispute through issuing bank
    - from: disputed
      to: settled
      trigger: Dispute resolved in merchant's favor (representment won)
    - from: disputed
      to: charged_back
      trigger: Dispute resolved in cardholder's favor or evidence deadline missed

- concept: FraudCase
  states:
    - name: opened
      description: Fraud engine flagged suspicious activity; case created for review
      terminal: false
    - name: investigating
      description: Analyst assigned and actively reviewing evidence
      terminal: false
    - name: escalated
      description: Case requires senior review or external investigation
      terminal: false
    - name: resolved
      description: Investigation complete; outcome determined
      terminal: true
  transitions:
    - from: opened
      to: investigating
      trigger: Analyst picks up or is assigned the case
    - from: investigating
      to: escalated
      trigger: Analyst determines case requires senior review or involves multiple merchants
    - from: investigating
      to: resolved
      trigger: Analyst determines outcome (confirmed_fraud, false_positive, or inconclusive)
    - from: escalated
      to: resolved
      trigger: Senior analyst or external investigation completes

- concept: Merchant
  states:
    - name: pending
      description: Application submitted; KYC and underwriting in progress
      terminal: false
    - name: active
      description: Merchant is live and can process payments
      terminal: false
    - name: suspended
      description: Temporarily disabled due to fraud, compliance, or merchant request
      terminal: false
    - name: deactivated
      description: Merchant permanently removed from platform
      terminal: true
  transitions:
    - from: pending
      to: active
      trigger: KYC verification and underwriting approval complete
    - from: pending
      to: deactivated
      trigger: Application rejected or withdrawn
    - from: active
      to: suspended
      trigger: Fraud investigation, compliance hold, or merchant request
    - from: suspended
      to: active
      trigger: Issue resolved and compliance clearance granted
    - from: suspended
      to: deactivated
      trigger: Merchant termination or unresolved compliance violation
    - from: active
      to: deactivated
      trigger: Merchant requests closure and all funds settled
