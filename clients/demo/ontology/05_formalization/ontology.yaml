# Canonical domain model — classes and relationships
# This is the formalized output of all prior stages.
#
# Schema:
#   classes:
#     - name: Class name (PascalCase)
#       definition: One-sentence canonical definition
#       properties: List of property names (detailed in properties.yaml)
#       identifier: Primary identifier property
#       relationships:
#         - target: Target class
#           type: has_many / has_one / belongs_to / references
#           label: Relationship name
#           cardinality: 1:1 / 1:N / N:M
#
# Fill this in after completing stages 0-4. Each class should trace back to
# a candidate concept from 02_concepts/ with a reviewed definition.

classes:
  - name: Transaction
    definition: A single payment attempt from a consumer to a merchant, tracked from initiation through final settlement or decline
    properties: [id, amount, currency, settlement_amount, settlement_currency, exchange_rate, status, idempotency_key, created_at, authorized_at, captured_at, settled_at, payment_method_token, merchant_id, parent_transaction_id]
    identifier: id
    relationships:
      - target: PaymentMethod
        type: references
        label: paid_via
        cardinality: "N:1"
      - target: Merchant
        type: belongs_to
        label: received_by
        cardinality: "N:1"
      - target: SettlementBatch
        type: belongs_to
        label: settled_in
        cardinality: "N:1"

  - name: PaymentMethod
    definition: A tokenized representation of a consumer's payment instrument stored securely in the card vault
    properties: [token, type, last_four, card_network, expiry_month, expiry_year, issuer_id, is_active]
    identifier: token
    relationships:
      - target: Transaction
        type: has_many
        label: used_for
        cardinality: "1:N"
      - target: Issuer
        type: references
        label: issued_by
        cardinality: "N:1"

  - name: Merchant
    definition: A business entity that accepts payments through the NovaPay platform under a contractual agreement
    properties: [id, legal_name, dba_name, mcc_code, status, onboarded_at, integration_tier, website_url, country]
    identifier: id
    relationships:
      - target: Transaction
        type: has_many
        label: receives
        cardinality: "1:N"
      - target: Account
        type: has_one
        label: funds_tracked_in
        cardinality: "1:1"
      - target: FeeSchedule
        type: has_one
        label: pricing_defined_by
        cardinality: "1:1"
      - target: Payout
        type: has_many
        label: receives_payouts
        cardinality: "1:N"
      - target: WebhookEvent
        type: has_many
        label: notified_via
        cardinality: "1:N"

  - name: SettlementBatch
    definition: A daily collection of captured transactions submitted together to the acquiring bank for fund transfer
    properties: [id, batch_date, acquirer_id, total_amount, transaction_count, status, submitted_at, reconciled_at]
    identifier: id
    relationships:
      - target: Transaction
        type: has_many
        label: contains
        cardinality: "1:N"
      - target: Acquirer
        type: references
        label: processed_by
        cardinality: "N:1"

  - name: Chargeback
    definition: A forced reversal of a previously settled transaction initiated by the cardholder's issuing bank
    properties: [id, transaction_id, amount, reason_code, status, opened_at, evidence_due_by, resolved_at, fee_amount]
    identifier: id
    relationships:
      - target: Transaction
        type: belongs_to
        label: reverses
        cardinality: "N:1"
      - target: FraudCase
        type: references
        label: may_trigger
        cardinality: "N:1"

  - name: FraudCase
    definition: An investigation record created when the fraud engine flags a transaction or pattern as suspicious
    properties: [id, risk_score, trigger_type, status, outcome, opened_at, assigned_to, resolved_at]
    identifier: id
    relationships:
      - target: Transaction
        type: references
        label: investigates
        cardinality: "N:M"
      - target: Merchant
        type: references
        label: involves
        cardinality: "N:1"

  - name: FeeSchedule
    definition: A merchant-specific pricing configuration defining processing fees and rate tiers
    properties: [id, merchant_id, effective_from, effective_to, per_txn_flat_fee, per_txn_percentage, monthly_fee, chargeback_fee, refund_fee, tier]
    identifier: id
    relationships:
      - target: Merchant
        type: belongs_to
        label: applies_to
        cardinality: "N:1"

  - name: Acquirer
    definition: The bank or financial institution that processes card transactions and settles funds on behalf of merchants
    properties: [id, name, bank_id, supported_networks, supported_currencies, settlement_schedule, is_active]
    identifier: id
    relationships:
      - target: SettlementBatch
        type: has_many
        label: processes
        cardinality: "1:N"

  - name: Issuer
    definition: The bank that issued the consumer's payment card and is responsible for cardholder funds
    properties: [id, name, bank_id, country, supported_networks]
    identifier: id
    relationships:
      - target: PaymentMethod
        type: has_many
        label: issued
        cardinality: "1:N"

  - name: Account
    definition: A financial account within NovaPay tracking a merchant's running balance and payout history
    properties: [id, merchant_id, currency, available_balance, pending_balance, total_settled, total_paid_out, created_at]
    identifier: id
    relationships:
      - target: Merchant
        type: belongs_to
        label: owned_by
        cardinality: "1:1"
      - target: Payout
        type: has_many
        label: funds_disbursed_via
        cardinality: "1:N"

  - name: Payout
    definition: A disbursement of accumulated settled funds from a merchant's NovaPay account to their external bank account
    properties: [id, merchant_id, account_id, amount, currency, status, scheduled_at, completed_at, bank_account_last_four]
    identifier: id
    relationships:
      - target: Account
        type: belongs_to
        label: drawn_from
        cardinality: "N:1"
      - target: Merchant
        type: belongs_to
        label: paid_to
        cardinality: "N:1"

  - name: WebhookEvent
    definition: An asynchronous HTTP notification sent to a merchant's endpoint when a significant payment event occurs
    properties: [id, event_type, merchant_id, endpoint_url, payload, status, created_at, delivered_at, retry_count, sequence_number]
    identifier: id
    relationships:
      - target: Transaction
        type: references
        label: triggered_by
        cardinality: "N:1"
      - target: Merchant
        type: belongs_to
        label: delivered_to
        cardinality: "N:1"
