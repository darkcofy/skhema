# Property definitions for canonical classes
# Details the attributes of each class in the ontology.
#
# Schema:
#   - class: Class name (matches ontology.yaml)
#     properties:
#       - name: Property name (snake_case)
#         type: String / Integer / Money / DateTime / Boolean / Enum / Reference
#         required: true / false
#         description: What this property represents
#         enum_ref: Reference to enums.yaml entry (if type is Enum)
#         source_mapping: Brief note on where this data comes from
#
# Example:
# - class: Transaction
#   properties:
#     - name: id
#       type: String
#       required: true
#       description: Unique transaction identifier
#       source_mapping: payment_gateway.transactions.txn_id
#     - name: amount
#       type: Money
#       required: true
#       description: Transaction amount in minor units
#       source_mapping: payment_gateway.transactions.amount_cents
#     - name: status
#       type: Enum
#       required: true
#       description: Current lifecycle state
#       enum_ref: TransactionStatus

- class: Transaction
  properties:
    - name: id
      type: String
      required: true
      description: Unique transaction identifier (UUID)
      source_mapping: payment_gateway.transactions.txn_id
    - name: amount
      type: Money
      required: true
      description: Transaction amount in the consumer's currency
      source_mapping: payment_gateway.transactions.amount_cents (divide by 100)
    - name: currency
      type: String
      required: true
      description: ISO 4217 currency code for the consumer-side amount
      source_mapping: payment_gateway.transactions.currency_code
    - name: settlement_amount
      type: Money
      required: false
      description: Transaction amount in the merchant's settlement currency
      source_mapping: payment_gateway.transactions.settle_amount_cents
    - name: settlement_currency
      type: String
      required: false
      description: ISO 4217 currency code for the merchant-side settlement
      source_mapping: payment_gateway.transactions.settle_currency_code
    - name: exchange_rate
      type: String
      required: false
      description: FX rate applied at authorization time (consumer currency to settlement currency)
      source_mapping: payment_gateway.transactions.fx_rate
    - name: status
      type: Enum
      required: true
      description: Current lifecycle state of the transaction
      enum_ref: TransactionStatus
      source_mapping: payment_gateway.transactions.txn_status
    - name: idempotency_key
      type: String
      required: true
      description: Client-generated key ensuring exactly-once processing
      source_mapping: payment_gateway.transactions.idemp_key
    - name: created_at
      type: DateTime
      required: true
      description: Timestamp when the transaction was initiated
      source_mapping: payment_gateway.transactions.created_at
    - name: authorized_at
      type: DateTime
      required: false
      description: Timestamp when authorization was approved
      source_mapping: payment_gateway.transactions.auth_at
    - name: captured_at
      type: DateTime
      required: false
      description: Timestamp when the transaction was captured
      source_mapping: payment_gateway.transactions.capture_at
    - name: settled_at
      type: DateTime
      required: false
      description: Timestamp when settlement was confirmed
      source_mapping: billing_ledger.settlement_batches.reconciled_at
    - name: payment_method_token
      type: Reference
      required: true
      description: Token referencing the consumer's payment instrument
      source_mapping: payment_gateway.transactions.card_token
    - name: merchant_id
      type: Reference
      required: true
      description: Identifier of the receiving merchant
      source_mapping: payment_gateway.transactions.merchant_ref
    - name: parent_transaction_id
      type: Reference
      required: false
      description: Reference to parent transaction for partial captures
      source_mapping: payment_gateway.transactions.parent_txn_id

- class: PaymentMethod
  properties:
    - name: token
      type: String
      required: true
      description: Vault-generated token replacing the actual card number
      source_mapping: payment_gateway.payment_methods.token
    - name: type
      type: Enum
      required: true
      description: Type of payment instrument
      enum_ref: PaymentMethodType
      source_mapping: payment_gateway.payment_methods.method_type
    - name: last_four
      type: String
      required: true
      description: Last four digits of the card or account number
      source_mapping: payment_gateway.payment_methods.card_last4
    - name: card_network
      type: Enum
      required: false
      description: Card network (Visa, Mastercard, etc.)
      enum_ref: CardNetwork
      source_mapping: payment_gateway.payment_methods.network
    - name: expiry_month
      type: Integer
      required: false
      description: Card expiration month (1-12)
      source_mapping: payment_gateway.payment_methods.exp_month
    - name: expiry_year
      type: Integer
      required: false
      description: Card expiration year (4-digit)
      source_mapping: payment_gateway.payment_methods.exp_year
    - name: issuer_id
      type: Reference
      required: false
      description: Reference to the issuing bank
      source_mapping: payment_gateway.payment_methods.issuer_bin (BIN lookup)
    - name: is_active
      type: Boolean
      required: true
      description: Whether this payment method can be used for new transactions
      source_mapping: payment_gateway.payment_methods.active

- class: Merchant
  properties:
    - name: id
      type: String
      required: true
      description: Unique merchant identifier (UUID)
      source_mapping: merchant_portal.merchants.merchant_id
    - name: legal_name
      type: String
      required: true
      description: Official registered business name
      source_mapping: merchant_portal.merchants.legal_name
    - name: dba_name
      type: String
      required: false
      description: Doing-business-as name (consumer-facing)
      source_mapping: merchant_portal.merchants.dba
    - name: mcc_code
      type: String
      required: true
      description: Merchant Category Code classifying the business type
      source_mapping: merchant_portal.merchants.mcc
    - name: status
      type: Enum
      required: true
      description: Current merchant lifecycle state
      enum_ref: MerchantStatus
      source_mapping: merchant_portal.merchants.status
    - name: onboarded_at
      type: DateTime
      required: false
      description: Timestamp when the merchant was activated
      source_mapping: merchant_portal.merchants.activated_at
    - name: integration_tier
      type: Enum
      required: true
      description: API access and support tier level
      enum_ref: IntegrationTier
      source_mapping: merchant_portal.merchants.tier
    - name: website_url
      type: String
      required: false
      description: Merchant's primary website URL
      source_mapping: merchant_portal.merchants.website
    - name: country
      type: String
      required: true
      description: ISO 3166-1 alpha-2 country code
      source_mapping: merchant_portal.merchants.country_code

- class: Chargeback
  properties:
    - name: id
      type: String
      required: true
      description: Unique chargeback identifier (UUID)
      source_mapping: billing_ledger.chargeback_records.cb_id
    - name: transaction_id
      type: Reference
      required: true
      description: Reference to the disputed transaction
      source_mapping: billing_ledger.chargeback_records.txn_ref
    - name: amount
      type: Money
      required: true
      description: Disputed amount
      source_mapping: billing_ledger.chargeback_records.amount
    - name: reason_code
      type: String
      required: true
      description: Card network reason code for the dispute
      source_mapping: billing_ledger.chargeback_records.reason
    - name: status
      type: Enum
      required: true
      description: Current chargeback lifecycle state
      enum_ref: ChargebackStatus
      source_mapping: billing_ledger.chargeback_records.status
    - name: opened_at
      type: DateTime
      required: true
      description: Timestamp when the chargeback was received
      source_mapping: billing_ledger.chargeback_records.created_at
    - name: evidence_due_by
      type: DateTime
      required: true
      description: Deadline for submitting representment evidence
      source_mapping: billing_ledger.chargeback_records.evidence_deadline
    - name: resolved_at
      type: DateTime
      required: false
      description: Timestamp when the chargeback was resolved
      source_mapping: billing_ledger.chargeback_records.resolved_at
    - name: fee_amount
      type: Money
      required: true
      description: Chargeback processing fee charged to the merchant
      source_mapping: billing_ledger.chargeback_records.fee

- class: FraudCase
  properties:
    - name: id
      type: String
      required: true
      description: Unique fraud case identifier (UUID)
      source_mapping: fraud_engine.fraud_cases.case_id
    - name: risk_score
      type: Integer
      required: true
      description: Numeric risk score (0-1000) assigned by the fraud engine
      source_mapping: fraud_engine.fraud_cases.score
    - name: trigger_type
      type: Enum
      required: true
      description: What triggered the case creation
      enum_ref: FraudTriggerType
      source_mapping: fraud_engine.fraud_cases.trigger
    - name: status
      type: Enum
      required: true
      description: Current investigation state
      enum_ref: FraudCaseStatus
      source_mapping: fraud_engine.fraud_cases.case_status
    - name: outcome
      type: Enum
      required: false
      description: Final determination of the investigation
      enum_ref: FraudCaseOutcome
      source_mapping: fraud_engine.fraud_cases.resolution
    - name: opened_at
      type: DateTime
      required: true
      description: Timestamp when the case was created
      source_mapping: fraud_engine.fraud_cases.created_at
    - name: assigned_to
      type: String
      required: false
      description: Analyst assigned to investigate
      source_mapping: fraud_engine.fraud_cases.assignee
    - name: resolved_at
      type: DateTime
      required: false
      description: Timestamp when the investigation concluded
      source_mapping: fraud_engine.fraud_cases.resolved_at

- class: SettlementBatch
  properties:
    - name: id
      type: String
      required: true
      description: Batch identifier (date-based format)
      source_mapping: billing_ledger.settlement_batches.batch_id
    - name: batch_date
      type: DateTime
      required: true
      description: The business date this batch covers
      source_mapping: billing_ledger.settlement_batches.batch_date
    - name: acquirer_id
      type: Reference
      required: true
      description: Reference to the acquiring bank processing this batch
      source_mapping: billing_ledger.settlement_batches.acquirer_ref
    - name: total_amount
      type: Money
      required: true
      description: Sum of all transaction amounts in the batch
      source_mapping: billing_ledger.settlement_batches.total_amount
    - name: transaction_count
      type: Integer
      required: true
      description: Number of transactions in the batch
      source_mapping: billing_ledger.settlement_batches.txn_count
    - name: status
      type: Enum
      required: true
      description: Current batch processing state
      enum_ref: SettlementBatchStatus
      source_mapping: billing_ledger.settlement_batches.status
