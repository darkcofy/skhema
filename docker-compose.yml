services:
  skhema:
    build: .
    volumes:
      - ./clients:/workspace/clients
      - ./manifest.yaml:/workspace/manifest.yaml:ro
      - ./skills:/workspace/skills:ro

  structurizr-lite:
    # The legacy `structurizr/lite` image is deprecated (exits with a banner
    # pointing here). `structurizr/structurizr` with the `local` command is
    # the current equivalent — same semantics, same workspace.dsl convention.
    image: structurizr/structurizr
    command: local
    ports:
      - "8080:8080"
    volumes:
      - ./clients/${CLIENT:-meshco}:/usr/local/structurizr
    environment:
      - STRUCTURIZR_WORKSPACE_FILENAME=workspace
